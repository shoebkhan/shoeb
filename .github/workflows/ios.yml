name: IPA

on:
  workflow_dispatch:
    inputs:
      buildConfiguration:
        description: 'Build configuration'
        required: true
        default: 'AdHocPreRelease'
        type: choice
        options:
          - AdHocPreRelease
          - AppStoreRelease
          - Debug

      store:
        description: 'Store'
        required: true
        default: 'firebaseDistribution'
        type: choice
        options:
          - firebaseDistribution
          - appStore
          - testFlight

      comment:
        description: 'Comment'
        required: false
        default: ''

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby (for Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: gem install fastlane

      - name: Run Fastlane
        run: |
          echo "Running build with config: ${{ github.event.inputs.buildConfiguration }}"
          echo "Target store: ${{ github.event.inputs.store }}"
          echo "Comment: ${{ github.event.inputs.comment }}"

          # Call appropriate Fastlane lane based on input
          if [[ "${{ github.event.inputs.store }}" == "firebaseDistribution" ]]; then
            fastlane ios firebase build_config:${{ github.event.inputs.buildConfiguration }} comment:"${{ github.event.inputs.comment }}"
          elif [[ "${{ github.event.inputs.store }}" == "appStore" ]]; then
            fastlane ios appstore build_config:${{ github.event.inputs.buildConfiguration }} comment:"${{ github.event.inputs.comment }}"
          else
            fastlane ios testflight build_config:${{ github.event.inputs.buildConfiguration }} comment:"${{ github.event.inputs.comment }}"
          fi
